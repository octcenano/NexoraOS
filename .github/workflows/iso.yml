name: ISO NexoraOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['system/**']

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mkarchiso necesita montar proc/dev dentro del airootfs durante pacstrap:
      # el contenedor del job corre sin privilegios, por lo que la construccion
      # se hace en un contenedor --privileged sobre la VM del runner.
      - name: Ensamblar perfil y generar ISO (contenedor privilegiado)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/nexora" -w /nexora \
            archlinux:base-devel \
            bash -e -c '
              pacman-key --init
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm archiso git rsync jq
              cd system
              bash archiso/build.sh assemble
              bash archiso/build.sh iso
            '

      - name: Verificar ISO generada
        run: |
          iso=$(ls system/out/*.iso)
          test -n "$iso"
          echo "ISO generada: $iso"
          ls -lh system/out/

      - uses: actions/upload-artifact@v4
        with:
          name: nexoraos-iso
          path: system/out/
