name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Compilación de sintaxis Python
        run: python -m compileall -q nexora tests
      - name: Tests unitarios e integración
        run: |
          status=0
          python -m unittest discover -s tests -v > test-output.log 2>&1 || status=$?
          cat test-output.log
          {
            echo "### tests (${{ matrix.python-version }}): exit $status, $(wc -c < test-output.log) bytes de salida"
            if [ "$status" -ne 0 ]; then
              echo '```'
              tail -n 120 test-output.log
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if grep -qE '^(FAIL|ERROR):' test-output.log; then
            grep -E '^(FAIL|ERROR):' test-output.log | head -20 | sed 's/^/::error::/'
          fi
          exit $status
      - name: Smoke test CLI
        run: |
          status=0
          {
            echo "### nexora --help"
            nexora --help
            echo "### nexora health"
            nexora health
            echo "### nexora-watchdog --diagnose --json"
            nexora-watchdog --diagnose --json
          } > smoke.log 2>&1 || status=$?
          cat smoke.log
          if [ "$status" -ne 0 ]; then
            tail -n 30 smoke.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Validación de configuración
        run: python -c "import json; json.load(open('config/defaults.json')); print('defaults.json OK')"
      - name: Publicar diagnóstico en un issue (los logs requieren sesión)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.run_id }} (número ${{ github.run_number }}), job tests (${{ matrix.python-version }}), commit ${{ github.sha }}."
            echo "### smoke.log"
            echo '```'
            cat smoke.log 2>/dev/null || echo "(smoke.log no existe)"
            echo '```'
            echo "### test-output.log (tail)"
            echo '```'
            tail -n 60 test-output.log 2>/dev/null || echo "(test-output.log no existe)"
            echo '```'
          } > issue-body.md
          gh issue create --repo octcenano/NexoraOS \
            --title "CI: fallo del job tests (run ${{ github.run_number }}, py${{ matrix.python-version }})" \
            --body-file issue-body.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (apt, versión fija por el canal de Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shopt -s nullglob
          files=(scripts/*.sh packaging/archiso/airootfs/root/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "sin scripts que revisar"
          else
            set -o pipefail
            shellcheck -f gcc "${files[@]}" 2>&1 | tee shellcheck.log
            status=$?
            # Diagnóstico visible: cada hallazgo como anotación del job.
            if grep -q ':' shellcheck.log; then
              sed 's/^/::error::/' shellcheck.log | head -30
            fi
            exit $status
          fi
      - name: Bash -n (sintaxis)
        run: |
          shopt -s nullglob
          for f in scripts/*.sh packaging/archiso/airootfs/root/*.sh; do bash -n "$f"; done
      - name: Detección de secretos accidentales (gitleaks v8.21.2, binario oficial)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --redact -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir wheel
        run: |
          status=0
          python -m pip install --upgrade pip build > build.log 2>&1 || status=$?
          python -m build --wheel >> build.log 2>&1 || status=$?
          tail -n 40 build.log
          if [ "$status" -ne 0 ]; then
            tail -n 30 build.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Validar wheel
        run: |
          status=0
          pip install dist/*.whl > validate.log 2>&1 || status=$?
          python -c "import nexora; print(nexora.__version__)" >> validate.log 2>&1 || status=$?
          nexora --help > /dev/null 2>> validate.log || status=$?
          tail -n 20 validate.log
          if [ "$status" -ne 0 ]; then
            tail -n 20 validate.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Publicar diagnóstico en un issue (los logs requieren sesión)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.run_id }} (número ${{ github.run_number }}), job package, commit ${{ github.sha }}."
            echo "### build.log (tail)"
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "(build.log no existe)"
            echo '```'
            echo "### validate.log (tail)"
            echo '```'
            tail -n 40 validate.log 2>/dev/null || echo "(validate.log no existe)"
            echo '```'
          } > issue-body.md
          gh issue create --repo octcenano/NexoraOS \
            --title "CI: fallo del job package (run ${{ github.run_number }})" \
            --body-file issue-body.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nexora-wheel
          path: dist/*.whl

  iso-build:
    runs-on: ubuntu-latest
    # mkarchiso necesita montar proc y dev en el chroot de instalacion:
    # sin --privileged el mount falla con "permission denied".
    container:
      image: archlinux:base
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de construcción
        run: |
          set -o pipefail
          status=0
          # El keyring de la imagen base suele estar caducado: inicializar y
          # actualizar archlinux-keyring antes de cualquier instalación.
          pacman-key --init >> pacman.log 2>&1 || status=$?
          pacman-key --populate archlinux >> pacman.log 2>&1 || status=$?
          pacman -Sy --noconfirm archlinux-keyring >> pacman.log 2>&1 || status=$?
          pacman -Su --noconfirm archiso python-build python-setuptools python-wheel git >> pacman.log 2>&1 || status=$?
          tail -n 40 pacman.log
          if [ "$status" -ne 0 ]; then
            tail -n 30 pacman.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Compilar wheel y validar perfil archiso
        run: |
          status=0
          python -m build --wheel --no-isolation > build-iso.log 2>&1 || status=$?
          test -f packaging/archiso/profiledef.sh || status=$?
          test -f packaging/archiso/packages.x86_64 || status=$?
          test -f packaging/archiso/pacman.conf || status=$?
          ls dist/*.whl >> build-iso.log 2>&1 || status=$?
          tail -n 30 build-iso.log
          if [ "$status" -ne 0 ]; then
            tail -n 20 build-iso.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Generar ISO (puede tardar)
        run: |
          set -o pipefail
          status=0
          mkdir -p out
          cp dist/*.whl packaging/archiso/airootfs/root/
          mkarchiso -v -w out/work -o out packaging/archiso > iso.log 2>&1 || status=$?
          tail -n 40 iso.log
          if [ "$status" -ne 0 ]; then
            tail -n 30 iso.log | sed 's/^/::error::/'
          else
            sha256sum out/*.iso
          fi
          exit $status
      - name: Publicar diagnóstico en un issue vía API (gh no está en el contenedor)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.run_id }} (número ${{ github.run_number }}), job iso-build, commit ${{ github.sha }}."
            echo "### pacman.log (tail)"
            echo '```'
            tail -n 60 pacman.log 2>/dev/null || echo "(pacman.log no existe)"
            echo '```'
            echo "### build-iso.log (tail)"
            echo '```'
            tail -n 40 build-iso.log 2>/dev/null || echo "(build-iso.log no existe)"
            echo '```'
            echo "### iso.log (tail)"
            echo '```'
            tail -n 80 iso.log 2>/dev/null || echo "(iso.log no existe)"
            echo '```'
          } > issue-body.md
          # Publicación vía API REST con curl: el contenedor archlinux:base no
          # incluye gh, así que el diagnóstico no puede depender de él. El
          # cuerpo JSON se construye con python3 (presente tras el paso de
          # dependencias; si pacman falló, se envía sin cuerpo detallado).
          if python3 -c "import json" 2> /dev/null; then
            python3 -c "import json,sys; print(json.dumps({'title': 'CI: fallo de iso-build (run ' + sys.argv[1] + ')', 'body': open('issue-body.md').read()}))" "${{ github.run_number }}" > issue-payload.json
          else
            printf '{"title":"CI: fallo de iso-build (run %s)","body":"(cuerpo no generado: python3 no disponible; ver anotaciones del job)"}\n' "${{ github.run_number }}" > issue-payload.json
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/octcenano/NexoraOS/issues \
            -d @issue-payload.json > curl-result.json 2>&1 || \
            { echo "::error::No se pudo publicar el issue de diagnóstico:"; head -c 500 curl-result.json; }
