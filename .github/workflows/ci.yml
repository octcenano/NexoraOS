name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Compilación de sintaxis Python
        run: python -m compileall -q nexora tests
      - name: Tests unitarios e integración
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v > test-output.log 2>&1
          status=$?
          cat test-output.log
          {
            echo "### tests (${{ matrix.python-version }}): exit $status, $(wc -c < test-output.log) bytes de salida"
            if [ "$status" -ne 0 ]; then
              echo '```'
              tail -n 120 test-output.log
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if grep -qE '^(FAIL|ERROR):' test-output.log; then
            grep -E '^(FAIL|ERROR):' test-output.log | head -20 | sed 's/^/::error::/'
          fi
          exit $status
      - name: Smoke test CLI
        run: |
          set -o pipefail
          {
            echo "### nexora --help"
            nexora --help
            echo "### nexora health"
            nexora health
            echo "### nexora-watchdog --diagnose --json"
            nexora-watchdog --diagnose --json
          } > smoke.log 2>&1
          status=$?
          cat smoke.log
          exit $status
      - name: Validación de configuración
        run: python -c "import json; json.load(open('config/defaults.json')); print('defaults.json OK')"
      - name: Publicar diagnóstico en un issue (los logs requieren sesión)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.run_id }} (número ${{ github.run_number }}), job tests (${{ matrix.python-version }}), commit ${{ github.sha }}."
            echo "### smoke.log"
            echo '```'
            cat smoke.log 2>/dev/null || echo "(smoke.log no existe)"
            echo '```'
            echo "### test-output.log (tail)"
            echo '```'
            tail -n 60 test-output.log 2>/dev/null || echo "(test-output.log no existe)"
            echo '```'
          } > issue-body.md
          gh issue create --repo octcenano/NexoraOS \
            --title "CI: fallo del job tests (run ${{ github.run_number }}, py${{ matrix.python-version }})" \
            --body-file issue-body.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (apt, versión fija por el canal de Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shopt -s nullglob
          files=(scripts/*.sh packaging/archiso/airootfs/root/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "sin scripts que revisar"
          else
            set -o pipefail
            shellcheck -f gcc "${files[@]}" 2>&1 | tee shellcheck.log
            status=$?
            # Diagnóstico visible: cada hallazgo como anotación del job.
            if grep -q ':' shellcheck.log; then
              sed 's/^/::error::/' shellcheck.log | head -30
            fi
            exit $status
          fi
      - name: Bash -n (sintaxis)
        run: |
          shopt -s nullglob
          for f in scripts/*.sh packaging/archiso/airootfs/root/*.sh; do bash -n "$f"; done
      - name: Detección de secretos accidentales (gitleaks v8.21.2, binario oficial)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --redact -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Validar wheel
        run: |
          pip install dist/*.whl
          python -c "import nexora; print(nexora.__version__)"
          nexora --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-wheel
          path: dist/*.whl

  iso-build:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de construcción
        run: |
          set -o pipefail
          pacman -Syu --noconfirm archiso python-build python-setuptools python-wheel git gh > pacman.log 2>&1
          status=$?
          tail -n 40 pacman.log
          exit $status
      - name: Compilar wheel y validar perfil archiso
        run: |
          python -m build --wheel --no-isolation
          test -f packaging/archiso/profiledef.sh
          test -f packaging/archiso/packages.x86_64
          test -f packaging/archiso/pacman.conf
          ls dist/*.whl
      - name: Generar ISO (puede tardar)
        run: |
          set -o pipefail
          command -v mkarchiso python || true
          mkdir -p out
          cp dist/*.whl packaging/archiso/airootfs/root/
          mkarchiso -v -w out/work -o out packaging/archiso > iso.log 2>&1
          status=$?
          tail -n 40 iso.log
          if [ "$status" -eq 0 ]; then
            sha256sum out/*.iso
          fi
          exit $status
      - name: Publicar diagnóstico en un issue (los logs requieren sesión)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.run_id }} (número ${{ github.run_number }}), job iso-build, commit ${{ github.sha }}."
            echo "### pacman.log (tail)"
            echo '```'
            tail -n 60 pacman.log 2>/dev/null || echo "(pacman.log no existe)"
            echo '```'
            echo "### iso.log (tail)"
            echo '```'
            tail -n 80 iso.log 2>/dev/null || echo "(iso.log no existe)"
            echo '```'
          } > issue-body.md
          gh issue create --repo octcenano/NexoraOS \
            --title "CI: fallo de iso-build (run ${{ github.run_number }})" \
            --body-file issue-body.md
