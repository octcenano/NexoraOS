# Cargador BIOS de NEXORA OS: delega en archiso.cfg del paquete archiso.
# Referencia: /usr/share/archiso/configs/releng/syslinux/syslinux.cfg
SERIAL 0 115200
TIMEOUT 30
ONTIMEOUT arch64

MENU TITLE NexoraOS Live
MENU CLEAR

LABEL arch64
TEXT HELP
Arrancar NEXORA OS Live (x86_64).
ENDTEXT
MENU LABEL Boot NexoraOS (x86_64)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%
