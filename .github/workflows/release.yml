name: Release

# Construye y publica los artefactos de una beta al crear un tag v*:
# wheel de Python, ISO de Arch y release borrador en GitHub con ambos.
# La publicación del release es manual (borrador): nadie publica sin revisión.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir y validar wheel
        run: |
          status=0
          python -m pip install --upgrade pip build > build.log 2>&1 || status=$?
          python -m build --wheel >> build.log 2>&1 || status=$?
          pip install dist/*.whl >> build.log 2>&1 || status=$?
          nexora --help > /dev/null 2>> build.log || status=$?
          tail -n 30 build.log
          if [ "$status" -ne 0 ]; then
            tail -n 20 build.log | sed 's/^/::error::/'
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  iso:
    runs-on: ubuntu-latest
    # mkarchiso necesita montar proc y dev en el chroot de instalación.
    container:
      image: archlinux:base
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de construcción
        run: |
          set -o pipefail
          status=0
          pacman-key --init >> pacman.log 2>&1 || status=$?
          pacman-key --populate archlinux >> pacman.log 2>&1 || status=$?
          pacman -Sy --noconfirm archlinux-keyring >> pacman.log 2>&1 || status=$?
          pacman -Su --noconfirm archiso python-build python-setuptools python-wheel git >> pacman.log 2>&1 || status=$?
          tail -n 30 pacman.log
          if [ "$status" -ne 0 ]; then
            tail -n 30 pacman.log | sed 's/^/::error::/'
          fi
          exit $status
      - name: Construir ISO
        run: |
          set -o pipefail
          status=0
          python -m build --wheel --no-isolation > iso.log 2>&1 || status=$?
          mkdir -p out
          cp dist/*.whl packaging/archiso/airootfs/root/
          mkarchiso -v -w out/work -o out packaging/archiso >> iso.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 iso.log | sed 's/^/::error::/'
            exit $status
          fi
          sha256sum out/*.iso > out/*.iso.sha256 2>/dev/null || \
            sha256sum out/*.iso > out/iso.sha256
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/*.iso*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [wheel, iso]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Crear release borrador con los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release borrador: requiere revisión y publicación manual.
          gh release create "${{ github.ref_name }}" \
            --repo octcenano/NexoraOS \
            --draft \
            --title "NexoraOS ${{ github.ref_name }}" \
            --notes "Beta de NexoraOS. Incluye el wheel instalable (pip) y la ISO live de Arch con Nexora Desktop. Verificar el sha256 antes de instalar." \
            artifacts/wheel/*.whl artifacts/iso/*
