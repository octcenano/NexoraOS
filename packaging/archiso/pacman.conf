[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
# Valor estándar del perfil releng de archiso: la firma del paquete es
# obligatoria, pero la ausencia de firma en la base de datos no es fatal
# (varios mirrors devuelven 404 para *.db.sig).
SigLevel = Required DatabaseOptional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
